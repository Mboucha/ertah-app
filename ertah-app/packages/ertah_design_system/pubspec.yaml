name: ertah_design_system
description: Ertah design tokens and Flutter theme, generated from the Figma file "Ertah app 27".
version: 0.3.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  # Both families are open source (SIL Open Font License 1.1, see fonts/OFL-*.txt).
  # Figma Typography collection: mode "Arabic" = IBM Plex Sans Arabic, mode "English" = Inter.
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-Bold.ttf
          weight: 700
